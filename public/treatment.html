  <link rel="stylesheet" href="/fonts.css">
  <style>
    :root { --paper: #f7f4ed; --ink: #2e2a24; --dim: #514d46; --line: rgba(46,42,36,.18); --sage: #66715d; --deep: #353d32; --gold: #a6885a; --serif: "Cormorant", Georgia, serif; --sans: "Montserrat", Arial, sans-serif; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 500 18px/1.8 var(--serif); }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 5px; }
    .navbar { position: fixed; inset: 0 0 auto; z-index: 10; display: flex; align-items: center; justify-content: space-between; min-height: 78px; padding: 14px clamp(22px, 6vw, 92px); background: rgba(247, 244, 237, .95); border-bottom: 1px solid transparent; transition: border-color .25s, box-shadow .25s; }
    .navbar.scrolled { border-color: var(--line); box-shadow: 0 8px 26px rgba(46, 42, 36, .04); }
    .brand { font: 700 20px/1 var(--sans); letter-spacing: .12em; white-space: nowrap; }
    .brand strong { color: var(--gold); font-weight: 700; }
    .brand-group { position: relative; display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); min-width: 0; }
    .language-switch { display: flex; align-items: center; gap: 3px; padding: 3px; border: 1px solid var(--line); }
    .language-button { display: inline-flex; align-items: center; gap: 5px; padding: 7px 8px; border: 0; background: transparent; color: var(--dim); cursor: pointer; font: 700 10px/1.2 var(--sans); }
    .language-button[aria-pressed="true"] { background: var(--deep); color: #f2eee4; }
    .language-button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .language-flag { font: 15px/1 var(--sans); }
    .menu-toggle { display: grid; gap: 5px; place-content: center; width: 44px; height: 44px; padding: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
    .menu-toggle span { display: block; width: 21px; height: 2px; background: currentColor; transition: transform .2s, opacity .2s; }
    .navbar.menu-open .menu-toggle span:first-child { transform: translateY(3.5px) rotate(45deg); }
    .navbar.menu-open .menu-toggle span:nth-child(2) { opacity: 0; }
    .navbar.menu-open .menu-toggle span:last-child { transform: translateY(-3.5px) rotate(-45deg); }
    .nav-links { position: absolute; top: calc(100% + 1px); right: clamp(22px, 6vw, 92px); display: flex; flex-direction: column; min-width: min(280px, calc(100vw - 44px)); padding: 8px 20px; border: 1px solid var(--line); background: var(--paper); box-shadow: 0 16px 36px rgba(46, 42, 36, .12); opacity: 0; visibility: hidden; transform: translateY(-8px); transition: opacity .2s, transform .2s, visibility .2s; }
    .navbar.menu-open .nav-links { opacity: 1; visibility: visible; transform: none; }
    .nav-links a { padding: 13px 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--dim); font: 700 10px/1.5 var(--sans); letter-spacing: .1em; text-align: left; text-transform: uppercase; transition: color .2s; }
    .nav-links a:last-child { border-bottom: 0; }
    .nav-links a:hover { color: var(--ink); }
    .nav-links .admin-link { color: var(--sage); }
    .brand-group .language-status:not(:empty) { position: absolute; top: calc(100% + 10px); left: 0; z-index: 1; max-width: min(320px, 80vw); padding: 8px 12px; border: 1px solid rgba(139, 51, 44, .25); background: var(--paper); color: #8b332c; font: 600 12px/1.5 var(--sans); }
    main { width: min(860px, calc(100% - 40px)); min-height: 65vh; margin: clamp(120px, 15vw, 170px) auto 90px; }
    .eyebrow { color: var(--sage); font: 700 10px/1.5 var(--sans); letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 16px 0; font: 500 clamp(42px, 8vw, 76px)/1.05 var(--serif); }
    .summary { max-width: 720px; margin: 0; color: var(--dim); font-size: clamp(20px, 3vw, 25px); }
    .rule { width: 52px; height: 1px; margin: 38px 0; background: var(--gold); }
    .content { color: var(--dim); }
    .content p { margin: 0 0 22px; white-space: pre-line; }
    .references { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--dim); font-size: 15px; }
    .references h2 { color: var(--ink); font: 700 18px/1.5 var(--sans); }
    .references li { margin: 8px 0; overflow-wrap: anywhere; }
    .references a { text-decoration: underline; text-underline-offset: 3px; }
    .contact-link { display: inline-block; margin-top: 20px; padding: 14px 20px; background: var(--deep); color: white; font: 700 10px/1.5 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
    .error { color: #8b332c; font-family: var(--sans); font-size: 15px; }
    footer { padding: 22px clamp(22px, 6vw, 92px); background: var(--deep); color: rgba(242, 238, 228, .92); text-align: center; font: 700 9px/1.7 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
    .translation-widget { position: fixed; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    body { top: 0 !important; }
    [hidden] { display: none !important; }
  </style>
