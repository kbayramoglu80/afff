  <link rel="stylesheet" href="/fonts.css">
  <style>
    :root { --paper: #f7f4ed; --ink: #2e2a24; --dim: #514d46; --line: rgba(46,42,36,.18); --sage: #66715d; --deep: #353d32; --gold: #a6885a; --serif: "Cormorant", Georgia, serif; --sans: "Montserrat", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 500 18px/1.8 var(--serif); }
    a { color: inherit; text-decoration: none; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 22px clamp(20px, 6vw, 80px); border-bottom: 1px solid var(--line); }
    .brand { font: 700 13px/1.5 var(--sans); letter-spacing: .12em; }
    .topbar-actions { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
    .topbar-actions a, .topbar-actions button { padding: 0; border: 0; background: none; color: var(--sage); cursor: pointer; font: 700 10px/1.5 var(--sans); letter-spacing: .08em; }
    main { width: min(860px, calc(100% - 40px)); min-height: 65vh; margin: clamp(54px, 10vw, 120px) auto 90px; }
    .eyebrow { color: var(--sage); font: 700 10px/1.5 var(--sans); letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 16px 0; font: 500 clamp(42px, 8vw, 76px)/1.05 var(--serif); }
    .summary { max-width: 720px; margin: 0; color: var(--dim); font-size: clamp(20px, 3vw, 25px); }
    .rule { width: 52px; height: 1px; margin: 38px 0; background: var(--gold); }
    .content { color: var(--dim); }
    .content p { margin: 0 0 22px; white-space: pre-line; }
    .references { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--dim); font-size: 15px; }
    .references h2 { color: var(--ink); font: 700 18px/1.5 var(--sans); }
    .references li { margin: 8px 0; overflow-wrap: anywhere; }
    .references a { text-decoration: underline; text-underline-offset: 3px; }
    .contact-link { display: inline-block; margin-top: 20px; padding: 14px 20px; background: var(--deep); color: white; font: 700 10px/1.5 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
    .error { color: #8b332c; font-family: var(--sans); font-size: 15px; }
    footer { padding: 24px; border-top: 1px solid var(--line); color: var(--dim); text-align: center; font: 600 10px/1.6 var(--sans); letter-spacing: .07em; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) { .topbar { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">MESUT K. · ORTOPEDİ VE TRAVMATOLOJİ</a>
    <nav class="topbar-actions" aria-label="Sayfa seçenekleri">
      <button id="language-toggle" type="button">EN</button>
      <a href="/#tedavi-alanlari" id="back-link">TEDAVİ ALANLARI</a>
    </nav>
  </header>
  <main>
    <span class="eyebrow" id="page-eyebrow">Tedavi alanı</span>
    <h1 id="page-title">__TREATMENT_TITLE__</h1>
    <p class="summary" id="page-summary">__TREATMENT_SUMMARY__</p>
    <div class="rule"></div>
    <article class="content" id="page-content">__TREATMENT_CONTENT__</article>
    <div id="page-references">__TREATMENT_REFERENCES__</div>
    <p class="error" id="page-error" role="status" hidden></p>
    <a class="contact-link" id="contact-link" href="/#iletisim">İletişim ve randevu</a>
  </main>
  <footer>Doç. Dr. Mesut Karıksız · Ortopedi ve Travmatoloji</footer>
  <script src="/public/treatment.js" defer></script>
</body>
</html>
